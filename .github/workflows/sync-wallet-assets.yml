name: Sync generated wallet assets
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-wallet-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build from locked dependencies
        working-directory: wallet-browser
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Verify and package
        run: |
          node tests/browser-test-wallet.mjs
          node tests/browser-wallet-funding.mjs
          node tests/browser-wallet-return.cjs
          node tests/security.cjs
          node tests/wallet-summary.cjs
          node tests/listing-management.cjs
          python scripts/package-local-wallet.py
          test "$(git hash-object dist/assets/test-wallet/wallet.js)" = "8746c31b0dbbfe3ba80633f3ac5c81eeb2aa1f22"
          test "$(git hash-object dist/downloads/xtm-market-local.zip)" = "24c66bd5e0a4e0a24e67f0dadf0e31a0d8e0965d"
      - name: Commit verified generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/assets/test-wallet/wallet.js dist/downloads/xtm-market-local.zip
          if ! git diff --cached --quiet; then
            git commit -m "Sync verified generated wallet bundle and local download"
            git push origin HEAD:main
          fi
